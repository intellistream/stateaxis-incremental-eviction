name: Extension CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "vllm-hust-ext @ git+https://github.com/vLLM-HUST/extension-manager.git@7d98891a2e7546f46de9b84d7549e831a85e3c20"
      - run: python -m pip install -e ".[test]" build
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - run: vllm-hust-ext extension inspect org.vllm-hust.stateaxis-incremental-eviction
      - if: matrix.python == '3.12'
        run: rustup component add rustfmt clippy
      - if: matrix.python == '3.12'
        run: cargo fmt --manifest-path native/Cargo.toml --check
      - if: matrix.python == '3.12'
        run: cargo test --manifest-path native/Cargo.toml --all-targets
      - if: matrix.python == '3.12'
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets -- -D warnings
