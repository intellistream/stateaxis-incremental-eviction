[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stateaxis-incremental-eviction"
version = "0.2.0"
description = "Bounded StateAxis bitmap eviction policy"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12", "vllm-hust-ext==0.2.0.dev0"]

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.stateaxis-incremental-eviction" = "stateaxis_incremental_eviction"

[project.entry-points."stateaxis.mod_handlers"]
incremental_eviction = "stateaxis_incremental_eviction:incremental_eviction"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaxis_incremental_eviction"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
